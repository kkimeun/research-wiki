<h1>Getting Started</h1>
<h2>Create a page</h2>
<p>Use the New Page button to add a research note.</p>
<h2>Edit and save</h2>
<p>Edit the document in the center panel and save it to disk.</p>
<h2>ChatGPT bridge</h2>
<p>Copy the current page context to ChatGPT and import a structured WIKI UPDATE response back into the Wiki.</p>
